[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regular-language-equivalence-checker"
version = "1.0.0"
description = "Decide equivalence of regular languages (regex / NFA / DFA) with counter-examples"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Abhijeet Rao" },
  { name = "Kaustub Thakur" },
  { name = "Avi Tyagi" },
]

[project.scripts]
eqchecker = "eqchecker.cli:main"

[tool.setuptools]
packages = ["eqchecker"]
